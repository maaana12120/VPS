name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: NvDAdmin

    steps:

      # 1. Enable Remote Desktop
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

      # 2. Create RDP account with random password
      - name: Create RDP Account
        shell: powershell
        run: |
          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $special = "!@#$%^&*"

          $allChars = $upper + $lower + $numbers + $special

          # Guarantee at least one character from each category
          $chars = @(
            $upper[(Get-Random -Maximum $upper.Length)]
            $lower[(Get-Random -Maximum $lower.Length)]
            $numbers[(Get-Random -Maximum $numbers.Length)]
            $special[(Get-Random -Maximum $special.Length)]
          )

          # Add remaining random characters
          for ($i = 0; $i -lt 16; $i++) {
            $chars += $allChars[(Get-Random -Maximum $allChars.Length)]
          }

          # Shuffle
          $password = -join ($chars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove existing account if present
          $existingUser = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue

          if ($existingUser) {
            Remove-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $env:RDP_USERNAME `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          # Save password for next step
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 3. Install and connect Tailscale
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY Secret is missing."
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          & $tailscale up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Could not get Tailscale IP."
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 4. Show RDP connection information
      - name: RDP Ready
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              RDP SERVER IS READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Open Windows Remote Desktop (mstsc)"
          Write-Host "and connect to the Tailscale IP above."
          Write-Host ""
          Write-Host "=================================================="

      # 5. Keep the runner alive
      - name: Keep Server Alive
        shell: powershell
        run: |
          $minutes = 350

          for ($i = 1; $i -le $minutes; $i++) {
            Start-Sleep -Seconds 60

            if (($i % 10) -eq 0) {
              Write-Host "[$i/$minutes] Server running..."
            }
          }
