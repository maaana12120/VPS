name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label"
        required: true
        default: "windows-latest"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360

    env:
      RDP_USERNAME: NvDAdmin

    steps:

      # =========================================================
      # 1. Detect hardware
      # =========================================================
      - name: 1. Detect Hardware
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host " GitHub Runner Hardware"
          Write-Host "============================================"

          $cpu = Get-CimInstance Win32_Processor |
            Measure-Object NumberOfLogicalProcessors -Sum

          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host "CPU Threads : $($cpu.Sum)"
          Write-Host "RAM (GB)    : $([math]::Round($ram.TotalPhysicalMemory / 1GB, 2))"

          Write-Host ""
          Write-Host "DISKS:"

          Get-CimInstance Win32_LogicalDisk |
            Where-Object { $_.DriveType -eq 3 } |
            Select-Object DeviceID,
                @{Name="SizeGB";Expression={[math]::Round($_.Size / 1GB,2)}},
                @{Name="FreeGB";Expression={[math]::Round($_.FreeSpace / 1GB,2)}} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "GPU:"

          Get-CimInstance Win32_VideoController |
            Select-Object Name,
                @{Name="VRAM_GB";Expression={
                    if ($_.AdapterRAM) {
                        [math]::Round($_.AdapterRAM / 1GB,2)
                    } else {
                        "Unknown"
                    }
                }} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "NVIDIA:"
          if (Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue) {
            nvidia-smi
          }
          else {
            Write-Host "No NVIDIA GPU detected."
          }

      # =========================================================
      # 2. Enable RDP
      # =========================================================
      - name: 2. Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep NLA enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service TermService -Force

          Write-Host "RDP enabled."

      # =========================================================
      # 3. Generate RDP password automatically
      # =========================================================
      - name: 3. Create RDP Account
        shell: powershell
        env:
          PROVIDED_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:PROVIDED_PASSWORD)) {

            Write-Host "RDP_PASSWORD Secret not found."
            Write-Host "Generating a temporary password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
            $password = -join (
              1..20 | ForEach-Object {
                $chars[(Get-Random -Maximum $chars.Length)]
              }
            )

          }
          else {

            Write-Host "Using RDP_PASSWORD from GitHub Secret."
            $password = $env:PROVIDED_PASSWORD
          }

          # Mask password if it ever appears in logs
          "::add-mask::$password"

          # Save password for later steps
          "RDP_PASSWORD_RUNTIME=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $user) {

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

          }
          else {

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "RDP account created successfully."

      # =========================================================
      # 4. Install Tailscale
      # =========================================================
      - name: 4. Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY Secret is missing."
          }

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale installation failed."
          }

          & $ts up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IP was not obtained."
          }

          "::add-mask::$ip"

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # =========================================================
      # 5. Install Google Chrome
      # =========================================================
      - name: 5. Install Google Chrome
        shell: powershell
        run: |

          winget install `
            --id Google.Chrome `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

      # =========================================================
      # 6. Install Visual Studio Code
      # =========================================================
      - name: 6. Install Visual Studio Code
        shell: powershell
        run: |

          winget install `
            --id Microsoft.VisualStudioCode `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

      # =========================================================
      # 7. Install GitHub CLI
      # =========================================================
      - name: 7. Install GitHub CLI
        shell: powershell
        run: |

          winget install `
            --id GitHub.cli `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

      # =========================================================
      # 8. Install Claude Code VS Code extension
      # =========================================================
      - name: 8. Install Claude Code Extension
        shell: powershell
        run: |

          $codePaths = @(
            "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd",
            "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd"
          )

          $code = $null

          foreach ($path in $codePaths) {
            if (Test-Path $path) {
              $code = $path
              break
            }
          }

          if (-not $code) {
            throw "VS Code CLI not found."
          }

          & $code `
            --install-extension `
            anthropic.claude-code `
            --force

          Write-Host "Claude Code extension installed."

      # =========================================================
      # 9. Verify installation
      # =========================================================
      - name: 9. Verify Environment
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================"
          Write-Host " Installed Software"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Claude Code Extension:"
          code --list-extensions |
            Where-Object { $_ -eq "anthropic.claude-code" }

          Write-Host ""
          Write-Host "Tailscale:"
          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "GPU:"
          if (Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue) {
            nvidia-smi
          }
          else {
            Write-Host "No NVIDIA GPU detected."
          }

      # =========================================================
      # 10. Show connection information
      # =========================================================
      - name: 10. RDP Connection Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             RDP SERVER READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : $env:RDP_PASSWORD_RUNTIME"
          Write-Host ""
          Write-Host "Open Windows Remote Desktop:"
          Write-Host "mstsc"
          Write-Host ""
          Write-Host "Connect to:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "=================================================="

      # =========================================================
      # 11. Keep alive ~6 hours
      # =========================================================
      - name: 11. Keep Server Alive
        shell: powershell
        run: |

          # Leave margin before the 360-minute job timeout.
          $targetMinutes = 350

          for ($i = 1; $i -le $targetMinutes; $i++) {

            Start-Sleep -Seconds 60

            if (($i % 10) -eq 0) {
              Write-Host "[$i/$targetMinutes] Server running..."
            }
          }

          Write-Host "Keep-alive completed."
