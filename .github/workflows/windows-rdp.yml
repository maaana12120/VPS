name: Windows RDP - Live Auto Snapshot

on:
  workflow_dispatch:
    inputs:
      restore_latest:
        description: "Restore latest snapshot before starting RDP"
        required: true
        default: true
        type: boolean

      final_snapshot:
        description: "Create final snapshot before runner exits"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: NvDAdmin
      SNAPSHOT_TAG: rdp-snapshot
      SESSION_ID: ${{ github.run_id }}

    steps:

      # ============================================================
      # 1. ENABLE RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Restart-Service `
            TermService `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."

      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================

      - name: Create RDP Account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $special = "!@#$%^&*"
          $all     = $upper + $lower + $numbers + $special

          $chars = @()

          $chars += $upper[(Get-Random -Maximum $upper.Length)]
          $chars += $lower[(Get-Random -Maximum $lower.Length)]
          $chars += $numbers[(Get-Random -Maximum $numbers.Length)]
          $chars += $special[(Get-Random -Maximum $special.Length)]

          for ($i = 0; $i -lt 20; $i++) {
              $chars += $all[(Get-Random -Maximum $all.Length)]
          }

          $password = -join ($chars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword

          }
          else {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword |
                Out-Null
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Output "::add-mask::$password"

          "RDP_PASSWORD=$password" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP account ready."

      # ============================================================
      # 3. TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 8

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              throw "Tailscale executable not found."
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 8

          $ip = (
              & $tailscale ip -4 |
              Select-Object -First 1
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw "Tailscale IPv4 address not found."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $ip"

      # ============================================================
      # 4. SNAPSHOT ENGINE
      # ============================================================

      - name: Snapshot Engine
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_LATEST: ${{ inputs.restore_latest }}
          FINAL_SNAPSHOT: ${{ inputs.final_snapshot }}

        run: |

          $ErrorActionPreference = "Stop"

          $Repo = $env:GITHUB_REPOSITORY
          $Tag  = $env:SNAPSHOT_TAG

          $UserRoot = "C:\Users\$env:RDP_USERNAME"

          $Root = "C:\RDP-AutoSnapshot"
          $Work = "$Root\Work"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Root,$Work |
            Out-Null


          # ========================================================
          # GITHUB CLI
          # ========================================================

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw "GH_TOKEN is empty."
          }

          function GH {

              param(
                  [Parameter(Mandatory=$true)]
                  [string[]]$Args
              )

              $output = & gh @Args 2>&1

              $code = $LASTEXITCODE

              if ($code -ne 0) {

                  Write-Host ($output -join "`n")

                  throw "GitHub CLI failed with exit code $code"
              }

              return $output
          }


          function GH-Safe {

              param(
                  [Parameter(Mandatory=$true)]
                  [string[]]$Args
              )

              $output = & gh @Args 2>&1

              if ($LASTEXITCODE -ne 0) {
                  return $null
              }

              return ($output -join "`n")
          }


          # ========================================================
          # RELEASE
          # ========================================================

          function Ensure-Release {

              $release = GH-Safe @(
                  "release",
                  "view",
                  $Tag,
                  "--repo",
                  $Repo
              )

              if (-not $release) {

                  Write-Host "Creating snapshot release..."

                  GH @(
                      "release",
                      "create",
                      $Tag,
                      "--repo",
                      $Repo,
                      "--title",
                      "RDP Automatic Snapshots",
                      "--notes",
                      "Automatic Windows RDP snapshots."
                  ) | Out-Null
              }
          }


          # ========================================================
          # MANIFEST
          # ========================================================

          function Download-Manifest {

              $dir = "$Work\Manifest"

              Remove-Item `
                $dir `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $dir |
                Out-Null

              GH-Safe @(
                  "release",
                  "download",
                  $Tag,
                  "--repo",
                  $Repo,
                  "--pattern",
                  "manifest.json",
                  "--dir",
                  $dir,
                  "--clobber"
              ) | Out-Null

              if (!(Test-Path "$dir\manifest.json")) {
                  return $null
              }

              try {

                  return (
                      Get-Content `
                        "$dir\manifest.json" `
                        -Raw |
                      ConvertFrom-Json
                  )

              }
              catch {

                  return $null
              }
          }


          # ========================================================
          # EXCLUDED FILES
          # ========================================================

          function Excluded {

              param(
                  [string]$Path
              )

              $p = $Path.Replace("/","\").ToLowerInvariant()

              if ($p -match "\\appdata\\local\\temp\\") {
                  return $true
              }

              if ($p -match "\\\.ssh\\id_[^\\]+$") {
                  return $true
              }

              if ($p -match "\\\.aws\\credentials$") {
                  return $true
              }

              if ($p -match "\\\.git-credentials$") {
                  return $true
              }

              if ($p -match "\\microsoft\\credentials\\") {
                  return $true
              }

              if ($p -match "\\login data$") {
                  return $true
              }

              return $false
          }


          # ========================================================
          # FILE MANIFEST
          # ========================================================

          function Manifest {

              param(
                  [string]$Base
              )

              $list =
                New-Object System.Collections.Generic.List[object]

              if (!(Test-Path $Base)) {
                  return $list
              }

              Write-Host "Scanning files..."

              Get-ChildItem `
                -LiteralPath $Base `
                -File `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue |

              ForEach-Object {

                  if (Excluded $_.FullName) {
                      return
                  }

                  try {

                      $relative =
                        $_.FullName.Substring(
                            $Base.Length
                        ).TrimStart("\")

                      $hash =
                        (
                            Get-FileHash `
                              -LiteralPath $_.FullName `
                              -Algorithm SHA256 `
                              -ErrorAction Stop
                        ).Hash

                      $list.Add(
                          [PSCustomObject]@{
                              path     = $relative
                              hash     = $hash
                              size     = $_.Length
                              modified =
                                $_.LastWriteTimeUtc.ToString("o")
                          }
                      )

                  }
                  catch {}
              }

              Write-Host "Files scanned: $($list.Count)"

              return $list
          }


          # ========================================================
          # WINDOWS STATE
          # ========================================================

          function SystemState {

              param(
                  [string]$Dest
              )

              Remove-Item `
                $Dest `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $Dest |
                Out-Null


              try {

                  winget export `
                    -o "$Dest\winget.json" `
                    --include-versions `
                    --accept-source-agreements `
                    2>$null |
                    Out-Null

              }
              catch {

                  "{}" |
                    Set-Content `
                      "$Dest\winget.json"
              }


              try {

                  @{
                      User =
                        [Environment]::GetEnvironmentVariables("User")

                      Machine =
                        [Environment]::GetEnvironmentVariables("Machine")

                  } |
                  ConvertTo-Json -Depth 30 |
                  Set-Content `
                    "$Dest\environment.json"

              }
              catch {}


              try {

                  Get-Service |
                  Select-Object `
                    Name,
                    DisplayName,
                    Status,
                    StartType |
                  ConvertTo-Json -Depth 10 |
                  Set-Content `
                    "$Dest\services.json"

              }
              catch {}


              try {

                  Get-ScheduledTask |
                  Select-Object `
                    TaskName,
                    TaskPath,
                    State |
                  ConvertTo-Json -Depth 10 |
                  Set-Content `
                    "$Dest\tasks.json"

              }
              catch {}


              try {

                  Get-NetFirewallRule |
                  Select-Object `
                    DisplayName,
                    Enabled,
                    Direction,
                    Action,
                    Profile |
                  ConvertTo-Json -Depth 10 |
                  Set-Content `
                    "$Dest\firewall.json"

              }
              catch {}


              try {

                  reg export `
                    HKCU `
                    "$Dest\HKCU.reg" `
                    /y |
                    Out-Null

              }
              catch {}
          }


          # ========================================================
          # COPY FILES
          # ========================================================

          function Copy-Files {

              param(
                  $Files,
                  [string]$Source,
                  [string]$Dest
              )

              foreach ($f in @($Files)) {

                  $src =
                    Join-Path `
                      $Source `
                      $f.path

                  if (!(Test-Path $src)) {
                      continue
                  }

                  if (Excluded $src) {
                      continue
                  }

                  $dst =
                    Join-Path `
                      $Dest `
                      $f.path

                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path (
                      Split-Path `
                        $dst `
                        -Parent
                    ) |
                    Out-Null

                  Copy-Item `
                    $src `
                    $dst `
                    -Force
              }
          }


          # ========================================================
          # UPLOAD
          # ========================================================

          function Upload {

              param(
                  [string]$Path
              )

              GH @(
                  "release",
                  "upload",
                  $Tag,
                  $Path,
                  "--repo",
                  $Repo,
                  "--clobber"
              ) | Out-Null
          }


          # ========================================================
          # SAVE SNAPSHOT
          # ========================================================

          function Save-Snapshot {

              param(
                  [string]$Reason
              )

              Write-Host ""
              Write-Host "=============================================="
              Write-Host "SNAPSHOT"
              Write-Host "Reason: $Reason"
              Write-Host "=============================================="


              Ensure-Release


              $current =
                @(Manifest $UserRoot)


              $state =
                "$Work\SystemState"

              SystemState $state


              $old =
                Download-Manifest


              # ====================================================
              # BASE SNAPSHOT
              # ====================================================

              if ($null -eq $old) {

                  Write-Host "Creating BASE snapshot..."

                  $seq = 1

                  $base =
                    "base-{0:D4}.zip" -f $seq

                  $build =
                    "$Work\Base"

                  Remove-Item `
                    $build `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue

                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path "$build\Files" |
                    Out-Null

                  Copy-Files `
                    $current `
                    $UserRoot `
                    "$build\Files"

                  Copy-Item `
                    $state `
                    "$build\SystemState" `
                    -Recurse `
                    -Force

                  $zip =
                    "$Work\$base"

                  Compress-Archive `
                    "$build\*" `
                    $zip `
                    -CompressionLevel Optimal `
                    -Force

                  Upload $zip


                  $manifest =
                    [ordered]@{

                      schema = 1

                      sequence = $seq

                      baseAsset = $base

                      deltaAssets = @()

                      files = $current

                      createdUtc =
                        [DateTime]::UtcNow.ToString("o")

                      changedFiles =
                        $current.Count

                      deletedFiles = 0

                      reason = $Reason
                    }
              }


              # ====================================================
              # DELTA SNAPSHOT
              # ====================================================

              else {

                  $oldMap = @{}

                  foreach ($f in @($old.files)) {
                      $oldMap[$f.path] = $f
                  }


                  $newMap = @{}

                  foreach ($f in $current) {
                      $newMap[$f.path] = $f
                  }


                  $changed = @()

                  foreach ($f in $current) {

                      if (
                          !$oldMap.ContainsKey($f.path) -or
                          $oldMap[$f.path].hash -ne $f.hash
                      ) {

                          $changed += $f
                      }
                  }


                  $deleted = @()

                  foreach ($f in @($old.files)) {

                      if (!$newMap.ContainsKey($f.path)) {

                          $deleted += $f.path
                      }
                  }


                  $seq =
                    [int]$old.sequence + 1

                  $deltas =
                    @($old.deltaAssets)

                  $delta =
                    "delta-{0:D4}.zip" -f $seq


                  Write-Host "Changed: $($changed.Count)"
                  Write-Host "Deleted: $($deleted.Count)"


                  $build =
                    "$Work\Delta"

                  Remove-Item `
                    $build `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue

                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path "$build\Files" |
                    Out-Null


                  Copy-Files `
                    $changed `
                    $UserRoot `
                    "$build\Files"


                  $deleted |
                    ConvertTo-Json |
                    Set-Content `
                      "$build\deleted.json"


                  Copy-Item `
                    $state `
                    "$build\SystemState" `
                    -Recurse `
                    -Force


                  $zip =
                    "$Work\$delta"

                  Compress-Archive `
                    "$build\*" `
                    $zip `
                    -CompressionLevel Optimal `
                    -Force

                  Upload $zip

                  $deltas += $delta


                  # ==================================================
                  # COMPACT AFTER 10 DELTAS
                  # ==================================================

                  if ($deltas.Count -ge 10) {

                      Write-Host "Compacting snapshots..."


                      $newBase =
                        "base-{0:D4}.zip" -f $seq

                      $newBuild =
                        "$Work\NewBase"


                      Remove-Item `
                        $newBuild `
                        -Recurse `
                        -Force `
                        -ErrorAction SilentlyContinue


                      New-Item `
                        -ItemType Directory `
                        -Force `
                        -Path "$newBuild\Files" |
                        Out-Null


                      Copy-Files `
                        $current `
                        $UserRoot `
                        "$newBuild\Files"


                      Copy-Item `
                        $state `
                        "$newBuild\SystemState" `
                        -Recurse `
                        -Force


                      $newZip =
                        "$Work\$newBase"


                      Compress-Archive `
                        "$newBuild\*" `
                        $newZip `
                        -CompressionLevel Optimal `
                        -Force


                      Upload $newZip


                      foreach ($a in $deltas) {

                          GH-Safe @(
                              "release",
                              "delete-asset",
                              $Tag,
                              $a,
                              "--repo",
                              $Repo,
                              "--yes"
                          ) | Out-Null
                      }


                      if (
                          $old.baseAsset -and
                          $old.baseAsset -ne $newBase
                      ) {

                          GH-Safe @(
                              "release",
                              "delete-asset",
                              $Tag,
                              $old.baseAsset,
                              "--repo",
                              $Repo,
                              "--yes"
                          ) | Out-Null
                      }


                      $base = $newBase

                      $deltas = @()
                  }

                  else {

                      $base =
                        [string]$old.baseAsset
                  }


                  $manifest =
                    [ordered]@{

                      schema = 1

                      sequence = $seq

                      baseAsset = $base

                      deltaAssets = $deltas

                      files = $current

                      createdUtc =
                        [DateTime]::UtcNow.ToString("o")

                      changedFiles =
                        $changed.Count

                      deletedFiles =
                        $deleted.Count

                      reason = $Reason
                    }
              }


              # ====================================================
              # SAVE MANIFEST
              # ====================================================

              $manifestPath =
                "$Work\manifest.json"


              $manifest |
                ConvertTo-Json -Depth 30 |
                Set-Content `
                  $manifestPath `
                  -Encoding utf8


              Upload $manifestPath


              Write-Host ""
              Write-Host "SNAPSHOT COMPLETE"
              Write-Host "Sequence: $($manifest.sequence)"
              Write-Host "Changed : $($manifest.changedFiles)"
              Write-Host "Deleted : $($manifest.deletedFiles)"
          }


          # ========================================================
          # RESTORE
          # ========================================================

          function Restore-Latest {

              Write-Host ""
              Write-Host "RESTORING LATEST SNAPSHOT"


              $m =
                Download-Manifest


              if ($null -eq $m) {

                  Write-Host "No snapshot exists."

                  return
              }


              $restore =
                "$Work\Restore"


              Remove-Item `
                $restore `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $restore |
                Out-Null


              # ====================================================
              # BASE
              # ====================================================

              GH @(
                  "release",
                  "download",
                  $Tag,
                  "--repo",
                  $Repo,
                  "--pattern",
                  $m.baseAsset,
                  "--dir",
                  $restore,
                  "--clobber"
              ) | Out-Null


              Expand-Archive `
                "$restore\$($m.baseAsset)" `
                "$restore\Base" `
                -Force


              if (Test-Path "$restore\Base\Files") {

                  Get-ChildItem `
                    "$restore\Base\Files" `
                    -File `
                    -Recurse `
                    -Force |

                  ForEach-Object {

                      $relative =
                        $_.FullName.Substring(
                          "$restore\Base\Files".Length
                        ).TrimStart("\")


                      $destination =
                        Join-Path `
                          $UserRoot `
                          $relative


                      New-Item `
                        -ItemType Directory `
                        -Force `
                        -Path (
                          Split-Path `
                            $destination `
                            -Parent
                        ) |
                        Out-Null


                      Copy-Item `
                        $_.FullName `
                        $destination `
                        -Force
                  }
              }


              # ====================================================
              # DELTAS
              # ====================================================

              foreach ($delta in @($m.deltaAssets)) {

                  Write-Host "Applying $delta"


                  GH @(
                      "release",
                      "download",
                      $Tag,
                      "--repo",
                      $Repo,
                      "--pattern",
                      $delta,
                      "--dir",
                      $restore,
                      "--clobber"
                  ) | Out-Null


                  $deltaDir =
                    "$restore\CurrentDelta"


                  Remove-Item `
                    $deltaDir `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue


                  Expand-Archive `
                    "$restore\$delta" `
                    $deltaDir `
                    -Force


                  if (Test-Path "$deltaDir\Files") {

                      Get-ChildItem `
                        "$deltaDir\Files" `
                        -File `
                        -Recurse `
                        -Force |

                      ForEach-Object {

                          $relative =
                            $_.FullName.Substring(
                              "$deltaDir\Files".Length
                            ).TrimStart("\")


                          $destination =
                            Join-Path `
                              $UserRoot `
                              $relative


                          New-Item `
                            -ItemType Directory `
                            -Force `
                            -Path (
                              Split-Path `
                                $destination `
                                -Parent
                            ) |
                            Out-Null


                          Copy-Item `
                            $_.FullName `
                            $destination `
                            -Force
                      }
                  }


                  if (Test-Path "$deltaDir\deleted.json") {

                      try {

                          $deleted =
                            @(
                              Get-Content `
                                "$deltaDir\deleted.json" `
                                -Raw |
                              ConvertFrom-Json
                            )


                          foreach ($relative in $deleted) {

                              $target =
                                Join-Path `
                                  $UserRoot `
                                  $relative


                              if (
                                Test-Path `
                                  $target `
                                  -PathType Leaf
                              ) {

                                  Remove-Item `
                                    $target `
                                    -Force `
                                    -ErrorAction SilentlyContinue
                              }
                          }

                      }
                      catch {}
                  }
              }


              Write-Host "RESTORE COMPLETE."
          }


          # ========================================================
          # RESTORE IF REQUESTED
          # ========================================================

          if ("$env:RESTORE_LATEST" -eq "true") {

              Restore-Latest
          }


          # ========================================================
          # INITIAL SNAPSHOT
          # ========================================================

          if ($null -eq (Download-Manifest)) {

              Save-Snapshot "initial"
          }


          # ========================================================
          # LIVE WATCHER
          # ========================================================

          $journal =
            "$Root\live-journal.jsonl"


          Remove-Item `
            $journal `
            -Force `
            -ErrorAction SilentlyContinue


          $watcher =
            New-Object IO.FileSystemWatcher


          $watcher.Path =
            $UserRoot


          $watcher.IncludeSubdirectories =
            $true


          $watcher.NotifyFilter =
            [IO.NotifyFilters]::FileName `
            -bor `
            [IO.NotifyFilters]::DirectoryName `
            -bor `
            [IO.NotifyFilters]::LastWrite `
            -bor `
            [IO.NotifyFilters]::Size


          $watcher.EnableRaisingEvents =
            $true


          $action = {

              $path =
                $Event.SourceEventArgs.FullPath

              if (!(Excluded $path)) {

                  [PSCustomObject]@{

                      utc =
                        [DateTime]::UtcNow.ToString("o")

                      event =
                        $Event.SourceEventArgs.ChangeType.ToString()

                      path =
                        $path

                  } |
                  ConvertTo-Json -Compress |
                  Add-Content `
                    $using:journal
              }
          }


          $subscriptions = @()


          foreach (
            $eventName in @(
              "Created",
              "Changed",
              "Deleted",
              "Renamed"
            )
          ) {

              $subscriptions +=
                Register-ObjectEvent `
                  -InputObject $watcher `
                  -EventName $eventName `
                  -Action $action
          }


          # ========================================================
          # RDP INFORMATION
          # ========================================================

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              RDP SERVER READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Live Watcher : ACTIVE"
          Write-Host "Snapshot     : EVERY 5 MINUTES"
          Write-Host ""
          Write-Host "=================================================="


          @"
          # Windows RDP

          **Tailscale IP:** `$env:TAILSCALE_IP`

          **Username:** `$env:RDP_USERNAME`

          **Password:** `$env:RDP_PASSWORD`

          ## Snapshot Engine

          - Live FileSystemWatcher: ACTIVE
          - SHA-256 snapshot: every 5 minutes
          - Base + Delta snapshots: ENABLED
          - Restore latest: $env:RESTORE_LATEST
          - Final snapshot: $env:FINAL_SNAPSHOT
          "@ |
          Out-File `
            $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8


          # ========================================================
          # KEEP RDP ALIVE
          # ========================================================

          $started =
            Get-Date


          $lastSnapshot =
            Get-Date


          try {

              while (
                ((Get-Date) - $started).TotalMinutes -lt 345
              ) {

                  Start-Sleep -Seconds 10


                  if (
                    ((Get-Date) - $lastSnapshot).TotalMinutes -ge 5
                  ) {

                      try {

                          Save-Snapshot `
                            "automatic-5-minute"

                      }
                      catch {

                          Write-Warning `
                            "Automatic snapshot failed: $($_.Exception.Message)"
                      }


                      $lastSnapshot =
                        Get-Date
                  }
              }
          }


          finally {

              Write-Host "Stopping live watcher..."


              foreach ($subscription in $subscriptions) {

                  Unregister-Event `
                    -SubscriptionId `
                    $subscription.Id `
                    -ErrorAction SilentlyContinue
              }


              $watcher.EnableRaisingEvents =
                $false


              $watcher.Dispose()


              # ====================================================
              # FINAL SNAPSHOT
              # ====================================================

              if (
                "$env:FINAL_SNAPSHOT" -eq "true"
              ) {

                  try {

                      Save-Snapshot `
                        "runner-exit"

                  }
                  catch {

                      Write-Warning `
                        "Final snapshot failed: $($_.Exception.Message)"
                  }
              }


              Write-Host ""
              Write-Host "RDP SESSION FINISHED."
          }
