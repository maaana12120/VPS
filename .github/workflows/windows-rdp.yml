name: Windows RDP - Live Auto Snapshot

on:
  workflow_dispatch:
    inputs:
      restore_latest:
        description: "Restore latest snapshot before starting RDP"
        required: true
        default: true
        type: boolean

      final_snapshot:
        description: "Create final snapshot before runner exits"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:

  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: NvDAdmin
      SNAPSHOT_TAG: rdp-snapshot
      SESSION_ID: ${{ github.run_id }}

    steps:

      # ============================================================
      # 1. Enable RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Restart-Service `
            TermService `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."


      # ============================================================
      # 2. Create RDP account
      # ============================================================

      - name: Create RDP Account
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $special = "!@#$%^&*"
          $all     = $upper + $lower + $numbers + $special

          $chars = @()

          $chars += $upper[(Get-Random -Maximum $upper.Length)]
          $chars += $lower[(Get-Random -Maximum $lower.Length)]
          $chars += $numbers[(Get-Random -Maximum $numbers.Length)]
          $chars += $special[(Get-Random -Maximum $special.Length)]

          for ($i = 0; $i -lt 20; $i++) {
              $chars += $all[(Get-Random -Maximum $all.Length)]
          }

          $password = -join ($chars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword

          }
          else {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword |
                Out-Null
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Mask password in GitHub logs
          Write-Output "::add-mask::$password"

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 3. Install Tailscale
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          Write-Host "Installing Tailscale..."

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 8

          $tailscale =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              throw "Tailscale executable was not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 10

          $ip =
            (& $tailscale ip -4 |
              Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale connected."


      # ============================================================
      # 4. Snapshot / Restore / Live Watcher
      # ============================================================

      - name: RDP Snapshot Engine
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_LATEST: ${{ inputs.restore_latest }}
          FINAL_SNAPSHOT: ${{ inputs.final_snapshot }}

        run: |

          $ErrorActionPreference = "Stop"

          # ========================================================
          # Configuration
          # ========================================================

          $Repo =
            $env:GITHUB_REPOSITORY

          $Tag =
            $env:SNAPSHOT_TAG

          $UserRoot =
            "C:\Users\$env:RDP_USERNAME"

          $Root =
            "C:\RDP-AutoSnapshot"

          $Work =
            "$Root\Work"

          $LiveJournal =
            "$Root\live-journal.jsonl"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Root,$Work |
            Out-Null


          # ========================================================
          # Verify GitHub CLI
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Checking GitHub CLI"
          Write-Host "=============================================="

          if (!(Get-Command gh -ErrorAction SilentlyContinue)) {
              throw "GitHub CLI (gh) is not installed."
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw "GH_TOKEN is empty."
          }

          Write-Host "Repository: $Repo"

          & gh --version

          Write-Host ""
          Write-Host "Testing GitHub authentication..."

          & gh auth status

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub authentication failed."
          }

          Write-Host "GitHub authentication: OK"


          # ========================================================
          # GitHub command wrapper
          # ========================================================

          function Invoke-GH {

              param(
                  [Parameter(Mandatory=$true)]
                  [string[]]$Arguments
              )

              Write-Host ""
              Write-Host "GH COMMAND:"
              Write-Host "gh $($Arguments -join ' ')"

              & gh @Arguments

              $code =
                $LASTEXITCODE

              if ($code -ne 0) {

                  throw `
                    "GitHub CLI command failed. Exit code: $code"
              }
          }


          # ========================================================
          # GitHub GET
          # ========================================================

          function Get-GH {

              param(
                  [Parameter(Mandatory=$true)]
                  [string[]]$Arguments
              )

              $result =
                & gh @Arguments 2>&1

              $code =
                $LASTEXITCODE

              if ($code -ne 0) {

                  Write-Host "GitHub command output:"
                  $result | ForEach-Object {
                      Write-Host $_
                  }

                  return $null
              }

              return (
                $result -join "`n"
              )
          }


          # ========================================================
          # Repository variable
          # ========================================================

          function Set-RepoVariable {

              param(
                  [string]$Name,
                  [string]$Value
              )

              $existing =
                Get-GH @(
                  "variable",
                  "get",
                  $Name,
                  "--repo",
                  $Repo
                )

              if ($null -eq $existing) {

                  Write-Host "Creating variable: $Name"

                  Invoke-GH @(
                    "variable",
                    "set",
                    $Name,
                    "--body",
                    $Value,
                    "--repo",
                    $Repo
                  )

              }
              else {

                  Write-Host "Updating variable: $Name"

                  Invoke-GH @(
                    "variable",
                    "set",
                    $Name,
                    "--body",
                    $Value,
                    "--repo",
                    $Repo
                  )
              }
          }


          function Get-RepoVariable {

              param(
                  [string]$Name
              )

              $result =
                Get-GH @(
                  "variable",
                  "get",
                  $Name,
                  "--repo",
                  $Repo,
                  "--json",
                  "value",
                  "--jq",
                  ".value"
                )

              return $result
          }


          # ========================================================
          # Ensure Release exists
          # ========================================================

          function Ensure-Release {

              Write-Host ""
              Write-Host "Checking snapshot release..."

              $release =
                Get-GH @(
                  "release",
                  "view",
                  $Tag,
                  "--repo",
                  $Repo
                )

              if ($null -eq $release) {

                  Write-Host "Creating release: $Tag"

                  Invoke-GH @(
                    "release",
                    "create",
                    $Tag,
                    "--repo",
                    $Repo,
                    "--title",
                    "RDP Automatic Snapshots",
                    "--notes",
                    "Automatic Base + Delta snapshots for Windows RDP."
                  )
              }
              else {

                  Write-Host "Snapshot release already exists."
              }
          }


          # ========================================================
          # Security exclusions
          # ========================================================

          function Test-Excluded {

              param(
                  [string]$Path
              )

              $p =
                $Path.Replace("/","\").ToLowerInvariant()


              # Temporary data
              if (
                $p -match "\\appdata\\local\\temp\\"
              ) {
                  return $true
              }


              # SSH private keys
              if (
                $p -match "\\\.ssh\\id_[^\\]+$"
              ) {
                  return $true
              }


              # AWS credentials
              if (
                $p -match "\\\.aws\\credentials$"
              ) {
                  return $true
              }


              # Git credentials
              if (
                $p -match "\\\.git-credentials$"
              ) {
                  return $true
              }


              # Windows credentials
              if (
                $p -match "\\microsoft\\credentials\\"
              ) {
                  return $true
              }


              # Browser passwords
              if (
                $p -match "\\login data$"
              ) {
                  return $true
              }


              return $false
          }


          # ========================================================
          # Full SHA-256 file scan
          # ========================================================

          function Get-FileManifest {

              param(
                  [string]$BasePath
              )

              $result =
                New-Object System.Collections.Generic.List[object]


              if (!(Test-Path $BasePath)) {
                  return $result
              }


              Write-Host ""
              Write-Host "Starting full SHA-256 scan..."

              Get-ChildItem `
                -LiteralPath $BasePath `
                -File `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue |
              ForEach-Object {

                  if (
                    Test-Excluded $_.FullName
                  ) {
                      return
                  }


                  try {

                      $relative =
                        $_.FullName.Substring(
                          $BasePath.Length
                        ).TrimStart("\")


                      $hash =
                        (
                          Get-FileHash `
                            -LiteralPath $_.FullName `
                            -Algorithm SHA256 `
                            -ErrorAction Stop
                        ).Hash


                      $result.Add(
                        [PSCustomObject]@{
                            path =
                              $relative

                            hash =
                              $hash

                            size =
                              $_.Length

                            modified =
                              $_.LastWriteTimeUtc.ToString("o")
                        }
                      )
                  }
                  catch {
                      Write-Host `
                        "Could not hash: $($_.FullName)"
                  }
              }


              Write-Host `
                "SHA-256 scan complete: $($result.Count) files"

              return $result
          }


          # ========================================================
          # Capture Windows configuration
          # ========================================================

          function Save-SystemState {

              param(
                  [string]$Destination
              )

              Remove-Item `
                $Destination `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $Destination |
                Out-Null


              # Installed programs
              try {

                  winget export `
                    -o "$Destination\winget.json" `
                    --include-versions `
                    --accept-source-agreements `
                    2>$null |
                    Out-Null

              }
              catch {

                  "{}" |
                    Set-Content `
                      "$Destination\winget.json"
              }


              # Environment variables
              @{
                  User =
                    [Environment]::GetEnvironmentVariables(
                      "User"
                    )

                  Machine =
                    [Environment]::GetEnvironmentVariables(
                      "Machine"
                    )

              } |
                ConvertTo-Json -Depth 30 |
                Set-Content `
                  "$Destination\environment.json"


              # Services
              try {

                  Get-Service |
                    Select-Object `
                      Name,
                      DisplayName,
                      Status,
                      StartType |
                    ConvertTo-Json -Depth 10 |
                    Set-Content `
                      "$Destination\services.json"

              }
              catch {}


              # Scheduled tasks
              try {

                  Get-ScheduledTask |
                    Select-Object `
                      TaskName,
                      TaskPath,
                      State |
                    ConvertTo-Json -Depth 10 |
                    Set-Content `
                      "$Destination\tasks.json"

              }
              catch {}


              # Firewall
              try {

                  Get-NetFirewallRule |
                    Select-Object `
                      DisplayName,
                      Enabled,
                      Direction,
                      Action,
                      Profile |
                    ConvertTo-Json -Depth 10 |
                    Set-Content `
                      "$Destination\firewall.json"

              }
              catch {}


              # HKCU
              try {

                  reg export `
                    HKCU `
                    "$Destination\HKCU.reg" `
                    /y |
                    Out-Null

              }
              catch {}
          }


          # ========================================================
          # Get latest manifest
          # ========================================================

          function Get-LatestManifest {

              $directory =
                "$Work\Manifest"

              Remove-Item `
                $directory `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $directory |
                Out-Null


              gh release download `
                $Tag `
                --repo $Repo `
                --pattern "manifest.json" `
                --dir $directory `
                --clobber `
                2>$null


              if (
                $LASTEXITCODE -ne 0 -or
                !(Test-Path "$directory\manifest.json")
              ) {
                  return $null
              }


              try {

                  return (
                    Get-Content `
                      "$directory\manifest.json" `
                      -Raw |
                    ConvertFrom-Json
                  )
              }
              catch {

                  return $null
              }
          }


          # ========================================================
          # Copy changed files
          # ========================================================

          function Copy-ManifestFiles {

              param(
                  $Files,
                  [string]$SourceRoot,
                  [string]$DestinationRoot
              )

              foreach($file in @($Files)) {

                  $source =
                    Join-Path `
                      $SourceRoot `
                      $file.path


                  if (!(Test-Path $source)) {
                      continue
                  }


                  if (Test-Excluded $source) {
                      continue
                  }


                  $destination =
                    Join-Path `
                      $DestinationRoot `
                      $file.path


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path (
                      Split-Path `
                        $destination `
                        -Parent
                    ) |
                    Out-Null


                  Copy-Item `
                    $source `
                    $destination `
                    -Force
              }
          }


          # ========================================================
          # Save Snapshot
          # ========================================================

          function Save-Snapshot {

              param(
                  [string]$Reason
              )


              Write-Host ""
              Write-Host "=============================================="
              Write-Host " SNAPSHOT START"
              Write-Host " Reason: $Reason"
              Write-Host "=============================================="


              Ensure-Release


              # Full scan
              $current =
                @(Get-FileManifest $UserRoot)


              # Windows state
              $systemState =
                "$Work\SystemState"

              Save-SystemState `
                $systemState


              # Existing snapshot
              $old =
                Get-LatestManifest


              # ====================================================
              # First snapshot
              # ====================================================

              if ($null -eq $old) {

                  Write-Host "No previous snapshot."
                  Write-Host "Creating BASE snapshot."


                  $sequence =
                    1

                  $base =
                    "base-{0:D4}.zip" -f $sequence


                  $build =
                    "$Work\Base"


                  Remove-Item `
                    $build `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path "$build\Files" |
                    Out-Null


                  Copy-ManifestFiles `
                    $current `
                    $UserRoot `
                    "$build\Files"


                  Copy-Item `
                    $systemState `
                    "$build\SystemState" `
                    -Recurse `
                    -Force


                  $zip =
                    "$Work\$base"


                  Remove-Item `
                    $zip `
                    -Force `
                    -ErrorAction SilentlyContinue


                  Compress-Archive `
                    -Path "$build\*" `
                    -DestinationPath $zip `
                    -CompressionLevel Optimal `
                    -Force


                  Invoke-GH @(
                    "release",
                    "upload",
                    $Tag,
                    $zip,
                    "--repo",
                    $Repo,
                    "--clobber"
                  )


                  $manifest = @{
                      schema = 1
                      sequence = 1
                      baseAsset = $base
                      deltaAssets = @()
                      files = $current
                      createdUtc =
                        [DateTime]::UtcNow.ToString("o")
                      changedFiles =
                        $current.Count
                      deletedFiles = 0
                      reason = $Reason
                  }
              }


              # ====================================================
              # Delta snapshot
              # ====================================================

              else {

                  $oldMap = @{}

                  foreach($f in @($old.files)) {
                      $oldMap[$f.path] = $f
                  }


                  $newMap = @{}

                  foreach($f in $current) {
                      $newMap[$f.path] = $f
                  }


                  $changed = @()

                  foreach($f in $current) {

                      if (
                        !$oldMap.ContainsKey($f.path) -or
                        $oldMap[$f.path].hash -ne $f.hash
                      ) {

                          $changed += $f
                      }
                  }


                  $deleted = @()

                  foreach($f in @($old.files)) {

                      if (
                        !$newMap.ContainsKey($f.path)
                      ) {

                          $deleted += $f.path
                      }
                  }


                  $sequence =
                    [int]$old.sequence + 1


                  $base =
                    [string]$old.baseAsset


                  $deltas =
                    @($old.deltaAssets)


                  $delta =
                    "delta-{0:D4}.zip" -f $sequence


                  Write-Host ""
                  Write-Host "Changed files: $($changed.Count)"
                  Write-Host "Deleted files: $($deleted.Count)"


                  $build =
                    "$Work\Delta"


                  Remove-Item `
                    $build `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path "$build\Files" |
                    Out-Null


                  Copy-ManifestFiles `
                    $changed `
                    $UserRoot `
                    "$build\Files"


                  $deleted |
                    ConvertTo-Json |
                    Set-Content `
                      "$build\deleted.json"


                  Copy-Item `
                    $systemState `
                    "$build\SystemState" `
                    -Recurse `
                    -Force


                  $zip =
                    "$Work\$delta"


                  Remove-Item `
                    $zip `
                    -Force `
                    -ErrorAction SilentlyContinue


                  Compress-Archive `
                    -Path "$build\*" `
                    -DestinationPath $zip `
                    -CompressionLevel Optimal `
                    -Force


                  Invoke-GH @(
                    "release",
                    "upload",
                    $Tag,
                    $zip,
                    "--repo",
                    $Repo,
                    "--clobber"
                  )


                  $deltas += $delta


                  # =================================================
                  # Compact after 10 deltas
                  # =================================================

                  if ($deltas.Count -ge 10) {

                      Write-Host ""
                      Write-Host "10 deltas reached."
                      Write-Host "Creating new BASE."


                      $newBase =
                        "base-{0:D4}.zip" -f $sequence


                      $newBuild =
                        "$Work\NewBase"


                      Remove-Item `
                        $newBuild `
                        -Recurse `
                        -Force `
                        -ErrorAction SilentlyContinue


                      New-Item `
                        -ItemType Directory `
                        -Force `
                        -Path "$newBuild\Files" |
                        Out-Null


                      Copy-ManifestFiles `
                        $current `
                        $UserRoot `
                        "$newBuild\Files"


                      Copy-Item `
                        $systemState `
                        "$newBuild\SystemState" `
                        -Recurse `
                        -Force


                      $newZip =
                        "$Work\$newBase"


                      Compress-Archive `
                        -Path "$newBuild\*" `
                        -DestinationPath $newZip `
                        -CompressionLevel Optimal `
                        -Force


                      Invoke-GH @(
                        "release",
                        "upload",
                        $Tag,
                        $newZip,
                        "--repo",
                        $Repo,
                        "--clobber"
                      )


                      # Delete old assets
                      foreach($asset in $deltas) {

                          gh release delete-asset `
                            $Tag `
                            $asset `
                            --repo $Repo `
                            --yes `
                            2>$null |
                            Out-Null
                      }


                      if (
                        $base -and
                        $base -ne $newBase
                      ) {

                          gh release delete-asset `
                            $Tag `
                            $base `
                            --repo $Repo `
                            --yes `
                            2>$null |
                            Out-Null
                      }


                      $base =
                        $newBase

                      $deltas =
                        @()
                  }


                  $manifest = @{
                      schema = 1
                      sequence = $sequence
                      baseAsset = $base
                      deltaAssets = $deltas
                      files = $current
                      createdUtc =
                        [DateTime]::UtcNow.ToString("o")
                      changedFiles =
                        $changed.Count
                      deletedFiles =
                        $deleted.Count
                      reason = $Reason
                  }
              }


              # ====================================================
              # Upload manifest
              # ====================================================

              $manifestPath =
                "$Work\manifest.json"


              $manifest |
                ConvertTo-Json -Depth 30 |
                Set-Content `
                  $manifestPath `
                  -Encoding utf8


              Invoke-GH @(
                "release",
                "upload",
                $Tag,
                $manifestPath,
                "--repo",
                $Repo,
                "--clobber"
              )


              # ====================================================
              # Change report
              # ====================================================

              $reportPath =
                "$Work\CHANGE-REPORT.txt"


              @"
RDP AUTOMATIC SNAPSHOT

UTC:
$([DateTime]::UtcNow.ToString("o"))

Sequence:
$($manifest.sequence)

Base:
$($manifest.baseAsset)

Delta count:
$(@($manifest.deltaAssets).Count)

Changed files:
$($manifest.changedFiles)

Deleted files:
$($manifest.deletedFiles)

Reason:
$Reason

Credential stores and private keys are excluded.
"@ |
                Set-Content `
                  $reportPath `
                  -Encoding utf8


              Invoke-GH @(
                "release",
                "upload",
                $Tag,
                $reportPath,
                "--repo",
                $Repo,
                "--clobber"
              )


              Write-Host ""
              Write-Host "=============================================="
              Write-Host " SNAPSHOT COMPLETE"
              Write-Host " Sequence: $($manifest.sequence)"
              Write-Host " Changed : $($manifest.changedFiles)"
              Write-Host " Deleted : $($manifest.deletedFiles)"
              Write-Host "=============================================="

              return $manifest
          }


          # ========================================================
          # Restore latest snapshot
          # ========================================================

          function Restore-Latest {

              Write-Host ""
              Write-Host "=============================================="
              Write-Host " RESTORE LATEST SNAPSHOT"
              Write-Host "=============================================="


              $manifest =
                Get-LatestManifest


              if ($null -eq $manifest) {

                  Write-Host "No snapshot exists."
                  return
              }


              $restore =
                "$Work\Restore"


              Remove-Item `
                $restore `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $restore |
                Out-Null


              # ----------------------------------------------------
              # Download BASE
              # ----------------------------------------------------

              Write-Host `
                "Downloading $($manifest.baseAsset)"


              gh release download `
                $Tag `
                --repo $Repo `
                --pattern $manifest.baseAsset `
                --dir $restore `
                --clobber


              if ($LASTEXITCODE -ne 0) {
                  throw "Could not download base snapshot."
              }


              Expand-Archive `
                "$restore\$($manifest.baseAsset)" `
                "$restore\Base" `
                -Force


              # ----------------------------------------------------
              # Restore BASE files
              # ----------------------------------------------------

              if(Test-Path "$restore\Base\Files") {

                  Get-ChildItem `
                    "$restore\Base\Files" `
                    -File `
                    -Recurse `
                    -Force |
                  ForEach-Object {

                      $relative =
                        $_.FullName.Substring(
                          "$restore\Base\Files".Length
                        ).TrimStart("\")


                      $destination =
                        Join-Path `
                          $UserRoot `
                          $relative


                      New-Item `
                        -ItemType Directory `
                        -Force `
                        -Path (
                          Split-Path `
                            $destination `
                            -Parent
                        ) |
                        Out-Null


                      Copy-Item `
                        $_.FullName `
                        $destination `
                        -Force
                  }
              }


              # ----------------------------------------------------
              # Apply DELTAS
              # ----------------------------------------------------

              foreach($delta in @($manifest.deltaAssets)) {

                  Write-Host `
                    "Applying $delta"


                  gh release download `
                    $Tag `
                    --repo $Repo `
                    --pattern $delta `
                    --dir $restore `
                    --clobber


                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not download $delta"
                  }


                  $deltaDir =
                    "$restore\CurrentDelta"


                  Remove-Item `
                    $deltaDir `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue


                  Expand-Archive `
                    "$restore\$delta" `
                    $deltaDir `
                    -Force


                  if(Test-Path "$deltaDir\Files") {

                      Get-ChildItem `
                        "$deltaDir\Files" `
                        -File `
                        -Recurse `
                        -Force |
                      ForEach-Object {

                          $relative =
                            $_.FullName.Substring(
                              "$deltaDir\Files".Length
                            ).TrimStart("\")


                          $destination =
                            Join-Path `
                              $UserRoot `
                              $relative


                          New-Item `
                            -ItemType Directory `
                            -Force `
                            -Path (
                              Split-Path `
                                $destination `
                                -Parent
                            ) |
                            Out-Null


                          Copy-Item `
                            $_.FullName `
                            $destination `
                            -Force
                      }
                  }


                  # Deleted files
                  if(Test-Path "$deltaDir\deleted.json") {

                      try {

                          $deleted =
                            @(
                              Get-Content `
                                "$deltaDir\deleted.json" `
                                -Raw |
                              ConvertFrom-Json
                            )


                          foreach($relative in $deleted) {

                              $target =
                                Join-Path `
                                  $UserRoot `
                                  $relative


                              if(
                                Test-Path `
                                  $target `
                                  -PathType Leaf
                              ) {

                                  Remove-Item `
                                    $target `
                                    -Force `
                                    -ErrorAction SilentlyContinue
                              }
                          }

                      }
                      catch {}
                  }
              }


              Write-Host ""
              Write-Host "=============================================="
              Write-Host " RESTORE COMPLETE"
              Write-Host " Snapshot sequence: $($manifest.sequence)"
              Write-Host "=============================================="
          }


          # ========================================================
          # Restore
          # ========================================================

          if (
            "$env:RESTORE_LATEST" -eq "true"
          ) {

              Restore-Latest
          }


          # ========================================================
          # Initial snapshot
          # ========================================================

          if ($null -eq (Get-LatestManifest)) {

              Save-Snapshot `
                "initial"
          }


          # ========================================================
          # LIVE FILE WATCHER
          # ========================================================

          Write-Host ""
          Write-Host "Starting Live FileSystemWatcher..."


          Remove-Item `
            $LiveJournal `
            -Force `
            -ErrorAction SilentlyContinue


          $watcher =
            New-Object `
              System.IO.FileSystemWatcher


          $watcher.Path =
            $UserRoot

          $watcher.IncludeSubdirectories =
            $true

          $watcher.NotifyFilter =
            [IO.NotifyFilters]::FileName `
            -bor `
            [IO.NotifyFilters]::DirectoryName `
            -bor `
            [IO.NotifyFilters]::LastWrite `
            -bor `
            [IO.NotifyFilters]::Size

          $watcher.EnableRaisingEvents =
            $true


          $eventAction = {

              $path =
                $Event.SourceEventArgs.FullPath


              if (!(Test-Excluded $path)) {

                  [PSCustomObject]@{

                      utc =
                        [DateTime]::UtcNow.ToString("o")

                      event =
                        $Event.SourceEventArgs.ChangeType.ToString()

                      path =
                        $path

                  } |
                    ConvertTo-Json -Compress |
                    Add-Content `
                      $using:LiveJournal
              }
          }


          $subscriptions = @()


          foreach(
            $eventName in
            @(
              "Created",
              "Changed",
              "Deleted",
              "Renamed"
            )
          ) {

              $subscriptions +=
                Register-ObjectEvent `
                  -InputObject $watcher `
                  -EventName $eventName `
                  -Action $eventAction
          }


          Write-Host "Live FileSystemWatcher: ACTIVE"


          # ========================================================
          # Register active RDP session
          # ========================================================

          Set-RepoVariable `
            "RDP_SESSION_ID" `
            $env:SESSION_ID


          Set-RepoVariable `
            "RDP_SAVE_REQUEST" `
            "0"


          Set-RepoVariable `
            "RDP_SAVE_ACK" `
            "0"


          # ========================================================
          # RDP information
          # ========================================================

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              RDP SERVER READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Live Watcher : ACTIVE"
          Write-Host "Auto Snapshot: EVERY 5 MINUTES"
          Write-Host "=================================================="


          # GitHub Step Summary
          @"
          # Windows RDP

          **Tailscale IP:** `$env:TAILSCALE_IP`

          **Username:** `$env:RDP_USERNAME`

          **Password:** `$env:RDP_PASSWORD`

          ## Snapshot

          - Live FileSystemWatcher: ACTIVE
          - Automatic SHA-256 scan: EVERY 5 MINUTES
          - Base + Delta snapshots: ENABLED
          - Restore latest: $env:RESTORE_LATEST
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8


          # ========================================================
          # Main loop
          # ========================================================

          $started =
            Get-Date


          $lastRequest =
            Get-RepoVariable `
              "RDP_SAVE_REQUEST"


          $lastSnapshot =
            Get-Date


          try {

              while(
                ((Get-Date) - $started).TotalMinutes -lt 345
              ) {


                  # =================================================
                  # Force Snapshot request
                  # =================================================

                  $request =
                    Get-RepoVariable `
                      "RDP_SAVE_REQUEST"


                  if(
                    $request -and
                    $request -ne "0" -and
                    $request -ne $lastRequest -and
                    $request.StartsWith(
                      "$env:SESSION_ID`:"
                    )
                  ) {

                      Write-Host ""
                      Write-Host "FORCE SNAPSHOT REQUEST RECEIVED"


                      $lastRequest =
                        $request


                      try {

                          Save-Snapshot `
                            "force-request"


                          Set-RepoVariable `
                            "RDP_SAVE_ACK" `
                            $request

                      }
                      catch {

                          Write-Host `
                            "Force snapshot failed: $($_.Exception.Message)"
                      }
                  }


                  # =================================================
                  # Automatic snapshot every 5 minutes
                  # =================================================

                  if(
                    ((Get-Date) - $lastSnapshot).TotalMinutes -ge 5
                  ) {

                      try {

                          Save-Snapshot `
                            "automatic-5-minute"

                      }
                      catch {

                          Write-Host `
                            "Automatic snapshot failed: $($_.Exception.Message)"
                      }


                      $lastSnapshot =
                        Get-Date
                  }


                  Start-Sleep `
                    -Seconds 10
              }
          }
          finally {

              Write-Host ""
              Write-Host "Stopping Live Watcher..."


              foreach($subscription in $subscriptions) {

                  Unregister-Event `
                    -SubscriptionId $subscription.Id `
                    -ErrorAction SilentlyContinue
              }


              $watcher.EnableRaisingEvents =
                $false

              $watcher.Dispose()


              # =====================================================
              # Final snapshot
              # =====================================================

              if(
                "$env:FINAL_SNAPSHOT" -eq "true"
              ) {

                  try {

                      Save-Snapshot `
                        "runner-exit"

                  }
                  catch {

                      Write-Host `
                        "Final snapshot failed: $($_.Exception.Message)"
                  }
              }


              # =====================================================
              # Clear active session
              # =====================================================

              $currentSession =
                Get-RepoVariable `
                  "RDP_SESSION_ID"


              if(
                $currentSession `
                -eq $env:SESSION_ID
              ) {

                  Set-RepoVariable `
                    "RDP_SESSION_ID" `
                    ""
              }


              Write-Host ""
              Write-Host "RDP SESSION FINISHED."
          }
